[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slatriage"
version = "0.1.0"
description = "Multi-agent LoRA adjudication of Slither alerts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jsonlines>=4.0",
  "tqdm>=4.66",
  "pandas>=2.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.1",
  "transformers>=4.44",
  "accelerate>=0.33",
  "peft>=0.12",
  "bitsandbytes>=0.43",
  "datasets>=2.20",
  "trl>=0.9",
]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
